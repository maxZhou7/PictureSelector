apply plugin: 'maven-publish'

// 检测发布环境
def isJitPack = System.getenv("JITPACK") == "true"
def hasLocalProps = project.rootProject.file('local.properties').exists()

def mavenUsername = null
def mavenPassword = null
def projectGroupId = null
def projectArtifactId = PUBLISH_ARTIFACT_ID
def projectVersionName = cfgs.versionName
def projectDescription = null
def projectGitUrl = null
def projectLicense = null
def projectLicenseUrl = null
def developerAuthorEmail = null
def developerAuthorId = null
def developerAuthorName = null

if (hasLocalProps) {
    Properties localProperties = new Properties()
    localProperties.load(project.rootProject.file('local.properties').newDataInputStream())
    localProperties.each { name, value ->
        project.ext[name] = value
    }
    mavenUsername = localProperties.getProperty("sonatype.username")
    mavenPassword = localProperties.getProperty("sonatype.password")
    projectGroupId = localProperties.getProperty("groupId")
    projectDescription = localProperties.getProperty("description")
    projectGitUrl = localProperties.getProperty("gitUrl")
    projectLicense = localProperties.getProperty("license")
    projectLicenseUrl = projectLicense ? "https://opensource.org/licenses/${projectLicense.toString().replace(" ", "-")}" : null
    developerAuthorEmail = localProperties.getProperty("email")
    developerAuthorId = mavenUsername
    developerAuthorName = mavenUsername
}

// JitPack 环境使用默认值
if (isJitPack) {
    projectGroupId = projectGroupId ?: 'com.github.maxZhou7'  // ← 替换为你的 GitHub 用户名
    projectDescription = projectDescription ?: projectArtifactId
    projectGitUrl = projectGitUrl ?: "https://github.com/maxZhou7/PictureSelector"  // ← 替换为你的仓库地址
    projectLicense = projectLicense ?: "Apache-2.0"
    projectLicenseUrl = projectLicenseUrl ?: "https://opensource.org/licenses/Apache-2.0"
    println("[JitPack] ${projectGroupId}:${projectArtifactId}:${projectVersionName}")
}

// Sonatype 发布需要 signing
def isSonatypePublish = !isJitPack && mavenUsername && mavenPassword && projectGroupId
if (isSonatypePublish) {
    apply plugin: 'signing'
    println("[Sonatype] ${projectGroupId}:${projectArtifactId}:${projectVersionName}")
} else if (!isJitPack) {
    println('Warning：缺少Sonatype发布参数，仅生成本地产物')
}

def isAndroidProject = project.hasProperty('android')
if (isAndroidProject) {
    println("使用Android工程方式发布")
    tasks.register('androidJavadocs', Javadoc) {
        source = android.sourceSets.main.java.srcDirs
        classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    }
    tasks.register('javadocsJar', Jar) {
        dependsOn androidJavadocs
        archiveClassifier.set("javadoc")
        from androidJavadocs.destinationDir
    }
    tasks.register('sourcesJar', Jar) {
        archiveClassifier.set("sources")
        from android.sourceSets.main.java.srcDirs
    }
} else {
    println("使用Java工程方式发布")
    tasks.register('javadocsJar', Jar) {
        dependsOn javadoc
        archiveClassifier.set("javadoc")
        from javadoc.destinationDir
    }
    tasks.register('sourcesJar', Jar) {
        archiveClassifier.set("sources")
        from sourceSets.main.allJava
    }
}

tasks.withType(Javadoc).configureEach {
    options {
        encoding "UTF-8"
        charSet 'UTF-8'
        author true
        version true
        links "http://docs.oracle.com/javase/8/docs/api"
        if (isAndroidProject) {
            linksOffline "http://d.android.com/reference", "${android.sdkDirectory}/docs/reference"
        }
        failOnError = false
    }
    enabled = false
}

artifacts {
    archives javadocsJar, sourcesJar
}

afterEvaluate {
    publishing {
        publications {
            aar(MavenPublication) {
                groupId = projectGroupId ?: projectArtifactId
                artifactId = projectArtifactId
                version = projectVersionName

                if (isAndroidProject) {
                    from components.release
                } else {
                    from components.java
                }
                artifact javadocsJar
                artifact sourcesJar

                pom {
                    name = projectArtifactId
                    description = projectDescription ?: projectArtifactId
                    url = projectGitUrl ?: ""
                    licenses {
                        license {
                            name = projectLicense ?: "Apache-2.0"
                            url = projectLicenseUrl ?: "https://opensource.org/licenses/Apache-2.0"
                        }
                    }
                    developers {
                        developer {
                            id = developerAuthorId ?: ""
                            name = developerAuthorName ?: ""
                            email = developerAuthorEmail ?: ""
                        }
                    }
                    scm {
                        connection = "scm:git:${projectGitUrl ?: ''}"
                        developerConnection = "scm:git:${projectGitUrl ?: ''}"
                        url = projectGitUrl ?: ""
                    }
                    withXml {
                        def dependenciesNode = asNode().appendNode('dependencies')
                        project.configurations.implementation.allDependencies.each {
                            def dependencyNode = dependenciesNode.appendNode('dependency')
                            dependencyNode.appendNode('groupId', it.group)
                            dependencyNode.appendNode('artifactId', it.name)
                            dependencyNode.appendNode('version', it.version)
                        }
                    }
                }
            }
        }

        // Sonatype 仓库（仅非 JitPack 环境配置）
        if (isSonatypePublish) {
            repositories {
                maven {
                    name = projectArtifactId
                    def releasesRepoUrl = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
                    def snapshotsRepoUrl = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
                    url = projectVersionName.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
                    credentials {
                        username mavenUsername
                        password mavenPassword
                    }
                }
            }
        }
    }

    if (isSonatypePublish) {
        signing {
            sign publishing.publications
        }
    }
}